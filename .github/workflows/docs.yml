name: docs

# Publishes the HTML user guide (docs/guide) to GitHub Pages: https://awkay.github.io/jxpilot/
# One-time repository setting: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['docs/guide/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Asciidoctor
        run: sudo gem install --no-document asciidoctor -v 2.0.23
      # The option and key tables are committed (docs/guide/generated/) and the main build fails when
      # they are stale, so no Java build is needed here.
      - name: Build the user guide
        run: make -C docs/guide html VERSION="main@${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/guide/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
